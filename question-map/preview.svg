<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI and cognition question map overview</title>
  <desc id="desc">An overview of the AI and cognition question map, with summary counts and evidence labels.</desc>
  <style>
    .bg { fill: #f8f8f6; }
    .card { fill: #ffffff; stroke: #e2e4e5; stroke-width: 1.5; }
    .note { fill: #fffdf3; stroke: #e8d9a5; stroke-width: 1.5; }
    .heading { fill: #1d252c; font: 700 33px Arial, sans-serif; }
    .body { fill: #4c555d; font: 400 16px Arial, sans-serif; }
    .value { fill: #385d87; font: 700 31px Arial, sans-serif; }
    .label { fill: #242d35; font: 700 15px Arial, sans-serif; }
    .small { fill: #68727b; font: 400 13px Arial, sans-serif; }
    .note-text { fill: #584f30; font: 400 15px Arial, sans-serif; }
    .note-label { fill: #554d2f; font: 700 15px Arial, sans-serif; }
    .legend { fill: #4d565e; font: 400 14px Arial, sans-serif; }
  </style>
  <rect class="bg" width="1200" height="760"/>
  <text class="heading" x="52" y="64">AI and cognition: the question map</text>
  <text class="body" x="52" y="96">A 50-record snapshot of the project’s initial evidence corpus, organized around seven questions.</text>

  <g transform="translate(52 132)">
    <rect class="card" width="250" height="132" rx="8"/>
    <text class="value" x="22" y="45">50</text><text class="label" x="22" y="70">unique source records</text>
    <text class="small" x="22" y="96">51 source appearances</text><text class="small" x="22" y="116">44 peer-reviewed · 6 preprint</text>
  </g>
  <g transform="translate(324 132)">
    <rect class="card" width="250" height="132" rx="8"/>
    <text class="value" x="22" y="45">22 / 28</text><text class="label" x="22" y="70">read in full vs. abstract only</text>
    <text class="small" x="22" y="98">Each study node shows access basis.</text>
  </g>
  <g transform="translate(596 132)">
    <rect class="card" width="250" height="132" rx="8"/>
    <text class="value" x="22" y="45">107,092</text><text class="label" x="22" y="70">people across 43 studies</text>
    <text class="small" x="22" y="98">Other records count cases, tasks,</text><text class="small" x="22" y="116">colonoscopies, or effect sizes.</text>
  </g>
  <g transform="translate(868 132)">
    <rect class="card" width="280" height="132" rx="8"/>
    <text class="value" x="22" y="45">24 / 50</text><text class="label" x="22" y="70">randomized</text>
    <text class="small" x="22" y="98">18 / 50 measured an outcome</text><text class="small" x="22" y="116">after AI access ended.</text>
  </g>

  <g transform="translate(52 290)">
    <rect class="note" width="1096" height="112" rx="8"/>
    <text class="note-label" x="22" y="32">Two numbers worth reading together.</text>
    <text class="note-text" x="22" y="57">Randomization can make a comparison fair. An outcome after AI access ends can make an unaided</text>
    <text class="note-text" x="22" y="79">outcome possible. An immediate post-test and a later follow-up answer different questions.</text>
  </g>

  <g transform="translate(52 434)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#647f99"/><text class="legend" x="20" y="12">Direct evidence</text>
    <rect x="192" y="0" width="12" height="12" rx="2" fill="#9b8659"/><text class="legend" x="212" y="12">Mixed findings</text>
    <rect x="376" y="0" width="12" height="12" rx="2" fill="#a87d73"/><text class="legend" x="396" y="12">Limited coverage</text>
    <rect x="585" y="0" width="12" height="12" rx="2" fill="#837c90"/><text class="legend" x="605" y="12">Indirect measures</text>
    <rect x="789" y="0" width="12" height="12" rx="2" fill="#fcfbfa" stroke="#b69a92"/><text class="legend" x="809" y="12">Open question</text>
  </g>

  <g transform="translate(52 482)">
    <rect class="card" width="524" height="212" rx="8"/>
    <rect x="0" y="0" width="4" height="212" rx="2" fill="#a87d73"/>
    <text x="24" y="38" fill="#765d56" font-family="Arial, sans-serif" font-size="13">LIMITED COVERAGE</text>
    <text class="label" x="24" y="72" font-size="21">Does AI change what you remember?</text>
    <text class="small" x="24" y="102">4 studies shown · 2 randomized · 3 measured after access ended</text>
    <rect x="24" y="124" width="454" height="64" rx="5" fill="#f3f5f6"/>
    <text class="label" x="40" y="150">Can you recall what you produced with AI?</text>
    <text class="small" x="40" y="174">Study links, design, sample, exposure, finding, and caveat</text>
  </g>
  <g transform="translate(624 482)">
    <rect class="card" width="524" height="212" rx="8"/>
    <rect x="0" y="0" width="4" height="212" rx="2" fill="#647f99"/>
    <text x="24" y="38" fill="#4a6c8b" font-family="Arial, sans-serif" font-size="13">DIRECT EVIDENCE</text>
    <text class="label" x="24" y="72" font-size="21">Does AI advice make judgment better or worse?</text>
    <text class="small" x="24" y="102">11 studies shown · 8 randomized · 0 measured after access ended</text>
    <rect x="24" y="124" width="454" height="64" rx="5" fill="#f3f5f6"/>
    <text class="label" x="40" y="150">What happens when the AI is wrong?</text>
    <text class="small" x="40" y="174">The map separates assisted performance from later ability.</text>
  </g>
  <text class="small" x="52" y="730">Open the interactive map to browse all seven questions and 50 selected source records.</text>
</svg>
