name: Corpus audit

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test_corpus_audit.py
      - run: python scripts/corpus_audit.py
      - run: python scripts/test_question_map_audit.py
      - run: python scripts/question_map_audit.py
